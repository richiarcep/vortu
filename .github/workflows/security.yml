name: security

# Automated dependency / CVE scanning. Runs on every PR, on pushes to main, and
# weekly (so newly-disclosed CVEs in already-pinned deps are caught even without
# a code change). Make these checks REQUIRED in the branch-protection rule for
# main (see docs/SECURITY.md → "Branch protection").

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip-audit
      # --no-deps audits the fully-pinned versions listed in requirements.txt
      # directly, without resolving/installing the heavy transitive tree
      # (e.g. chromadb -> torch), keeping the job fast and deterministic.
      - run: pip-audit --requirement backend/requirements.txt --no-deps --desc

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
