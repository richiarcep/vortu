# Vela — production stack for a single Hetzner server.
#
#   Browser ──HTTPS──► Caddy ──┬──► frontend (Next.js)      :3000   (everything)
#                              └──► backend  (FastAPI)      :8000   (/api/*, /health)
#   Backend ──► Neon Postgres (managed, external)
#           └─► Neo4j Aura     (managed, external)
#
# Same-origin routing (domain.com + domain.com/api) → NO CORS to configure.
#
# Setup:  cp .env.production.example .env   # then fill it in
#         docker compose up -d --build
# Vars are read from the root `.env` (compose substitution + backend env_file).

services:
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      # Single web worker so the in-process scheduler runs exactly once. To scale
      # web workers, raise WEB_CONCURRENCY, set ENABLE_SCHEDULER=false here, and
      # add a separate one-worker service with ENABLE_SCHEDULER=true.
      ENABLE_SCHEDULER: "true"
      WEB_CONCURRENCY: "1"
    expose: ["8000"]
    volumes:
      - backend_uploads:/app/uploads
      - backend_payslips:/app/payslips
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Same origin as the site → API reached at /api/* through Caddy.
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL:-http://localhost}
    expose: ["3000"]
    depends_on: [backend]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_payslips:
  caddy_data:
  caddy_config:
